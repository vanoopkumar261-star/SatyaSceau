<!doctype html>
<!-- Customer upload page, opened from the printed QR (/pay/<merchant_id>).
     Owner: Pile 2 (Vision). Spec: docs/WORK_SPLIT.md -> Pile 2, Step 4.
     No login, no analytics, no external scripts or fonts. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SatyaSceau — Show your payment</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 20px; padding: 24px; text-align: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #f4f6f8; color: #1a2330; }
    h1 { margin: 0; font-size: 1.6rem; }
    .tag { margin: 0; color: #5b6776; }
    .big { width: 100%; max-width: 360px; padding: 26px 16px; font-size: 1.3rem; font-weight: 700;
           color: #fff; background: #1b5fd6; border: 0; border-radius: 16px; cursor: pointer; }
    .big:active { background: #144aa8; }
    .big[disabled] { background: #8a96a8; cursor: default; }
    input[type=file] { display: none; }
    .spinner { width: 44px; height: 44px; border: 5px solid #cfd6e0; border-top-color: #1b5fd6;
               border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .sent { font-size: 1.25rem; font-weight: 700; }
    .status { width: 100%; max-width: 360px; padding: 18px 16px; border-radius: 14px; font-weight: 700;
              font-size: 1.1rem; }
    .status small { display: block; margin-top: 6px; font-weight: 400; font-size: .95rem; }
    .WAITING { background: #fff4d6; color: #7a5600; }
    .VERIFIED { background: #d9f5e1; color: #11632a; }
    .NOT_VERIFIED { background: #fde0e0; color: #8a1c1c; }
    .error { color: #8a1c1c; font-weight: 600; max-width: 360px; }
    .again { background: none; border: 0; color: #1b5fd6; font-size: 1rem; text-decoration: underline; cursor: pointer; }
    .langs { display: flex; gap: 8px; }
    .langs button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid #b8c2d0;
                    background: #fff; color: #1a2330; cursor: pointer; }
    .langs button[aria-pressed="true"] { border-color: #1b5fd6; color: #1b5fd6; font-weight: 700; }
  </style>
</head>
<body>
  <h1>SatyaSceau</h1>
  <p class="tag">Every payment gets a witness.</p>
  <div class="langs" role="group" aria-label="Voice language">
    <button type="button" data-lang="hi" aria-pressed="true">🔊 हिंदी</button>
    <button type="button" data-lang="en" aria-pressed="false">🔊 English</button>
  </div>

  <!-- No `capture` attribute: the phone offers both camera and gallery. -->
  <input id="file" type="file" accept="image/*">
  <button id="pick" class="big" type="button">Upload payment screenshot</button>

  <div id="spinner" class="spinner hidden" role="status" aria-label="Checking"></div>
  <div id="sent" class="sent hidden">Sent ✓ — show this to the shopkeeper</div>
  <div id="status" class="status hidden" aria-live="polite"></div>
  <div id="error" class="error hidden" role="alert"></div>
  <button id="again" class="again hidden" type="button">Upload a different screenshot</button>

<script>
(function () {
  var merchantId = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  var $ = function (id) { return document.getElementById(id); };
  var pick = $("pick"), file = $("file"), spinner = $("spinner"), sent = $("sent"),
      statusEl = $("status"), errorEl = $("error"), again = $("again");
  var pollTimer = null;

  var LABELS = {
    en: { WAITING: "Checking with the bank…", VERIFIED: "Payment verified", NOT_VERIFIED: "Payment not verified" },
    hi: { WAITING: "बैंक से पुष्टि हो रही है…", VERIFIED: "भुगतान सत्यापित", NOT_VERIFIED: "भुगतान सत्यापित नहीं" }
  };
  // Spoken verdicts, so the customer hears the result too (same idea as the merchant screen).
  var SAY = {
    en: { WAITING: "Waiting for the bank. Please wait a moment.", VERIFIED: "Payment verified.",
          NOT_VERIFIED: "Payment not verified." },
    hi: { WAITING: "बैंक से पुष्टि का इंतज़ार है, कृपया रुकें", VERIFIED: "भुगतान सत्यापित हो गया",
          NOT_VERIFIED: "भुगतान सत्यापित नहीं हुआ" }
  };
  var lang = "hi";
  try { if (localStorage.getItem("satyasceau.lang") === "en") lang = "en"; } catch (e) { /* private mode */ }
  var lastSpoken = "";
  var canSpeak = "speechSynthesis" in window;

  function voiceFor(code) {
    if (!canSpeak) return null;
    var voices = speechSynthesis.getVoices();
    for (var i = 0; i < voices.length; i++) if (voices[i].lang === code) return voices[i];
    for (var j = 0; j < voices.length; j++) if (voices[j].lang.toLowerCase().indexOf(code.slice(0, 2)) === 0) return voices[j];
    return null;
  }

  function unlockAudio() {           // must run inside a tap: phones block speech until the user interacts
    if (!canSpeak) return;
    try { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
  }

  function speak(status, caseId) {
    var key = caseId + ":" + status;
    if (!canSpeak || !SAY.en[status] || key === lastSpoken) return;   // each verdict once
    lastSpoken = key;
    var useHindi = lang === "hi" && voiceFor("hi-IN");               // no Hindi voice -> English
    var code = useHindi ? "hi-IN" : "en-IN";
    var u = new SpeechSynthesisUtterance(SAY[useHindi ? "hi" : "en"][status]);
    u.lang = code;
    var v = voiceFor(code);
    if (v) u.voice = v;
    u.rate = 0.95;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    if (status === "NOT_VERIFIED" && navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  var langButtons = document.querySelectorAll("[data-lang]");
  function setLang(next) {
    lang = next;
    try { localStorage.setItem("satyasceau.lang", next); } catch (e) { /* private mode */ }
    for (var i = 0; i < langButtons.length; i++) langButtons[i].setAttribute("aria-pressed", String(langButtons[i].dataset.lang === next));
  }
  for (var b = 0; b < langButtons.length; b++) {
    langButtons[b].addEventListener("click", function () { unlockAudio(); setLang(this.dataset.lang); });
  }
  setLang(lang);

  function show(el, on) { el.classList.toggle("hidden", !on); }

  function showStatus(data) {
    statusEl.className = "status " + data.status;
    statusEl.textContent = LABELS[lang][data.status] || data.status;
    speak(data.status, data.case_id);
    var small = document.createElement("small");
    small.textContent = data.reason || "";   // textContent: never inject server text as HTML
    statusEl.appendChild(small);
    show(statusEl, true);
  }

  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function poll(caseId) {
    stopPolling();
    pollTimer = setInterval(function () {
      fetch("/api/cases/" + encodeURIComponent(caseId))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (!data) return;
          showStatus(data);
          if (data.status !== "WAITING") stopPolling();
        })
        .catch(function () { /* offline blip: try again on the next tick */ });
    }, 3000);
  }

  function fail(message) {
    show(spinner, false);
    errorEl.textContent = message;
    show(errorEl, true);
    pick.disabled = false;
    show(pick, true);
  }

  function reset() {
    stopPolling();
    [sent, statusEl, errorEl, again, spinner].forEach(function (el) { show(el, false); });
    file.value = "";
    pick.disabled = false;
    show(pick, true);
  }

  pick.addEventListener("click", function () { unlockAudio(); file.click(); });
  again.addEventListener("click", reset);

  file.addEventListener("change", function () {
    var img = file.files && file.files[0];
    if (!img) return;
    stopPolling();
    [sent, statusEl, errorEl, again].forEach(function (el) { show(el, false); });
    pick.disabled = true;
    show(pick, false);
    show(spinner, true);

    var form = new FormData();
    form.append("merchant_id", merchantId);
    form.append("image", img);
    fetch("/api/proof", { method: "POST", body: form })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) { return { ok: r.ok, code: r.status, body: body }; });
      })
      .then(function (res) {
        if (!res.ok) {
          var msg = { 404: "This QR code is not valid. Ask the shopkeeper for a new one.",
                      413: "That photo is too big. Use a screenshot instead.",
                      415: "Please choose a photo or screenshot (JPEG, PNG or WebP).",
                      400: "We could not read that image. Try another screenshot." }[res.code];
          return fail(msg || "Something went wrong. Please try again.");
        }
        show(spinner, false);
        show(sent, true);
        showStatus(res.body);
        show(again, true);
        if (res.body.status === "WAITING") poll(res.body.case_id);
      })
      .catch(function () { fail("No connection. Check your internet and try again."); });
  });
})();
</script>
</body>
</html>
