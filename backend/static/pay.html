<!doctype html>
<!-- Customer upload page, opened from the printed QR (/pay/<merchant_id>).
     Owner: Pile 2 (Vision). System: DESIGN.md + /static/css/theme.css.
     No login, no analytics. Ids #file #pick #spinner #sent #status #error #again and the .hidden class are read by the script. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SatyaSceau — Show your payment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400..800&amp;family=Noto+Sans+Devanagari:wght@400;600;700&amp;family=Source+Code+Pro:wght@400..600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=account_balance,add_card,block,cancel,check,check_circle,chevron_right,content_copy,error,expand_more,fingerprint,hourglass_empty,hourglass_top,image,info,key,language,lock,login,logout,photo_camera,print,qr_code_2,receipt_long,record_voice_over,remove,replay,schedule,search,shield,sms,storefront,sync,task_alt,translate,upload,upload_file,verified,verified_user,visibility,visibility_off,volume_up,warning,wifi_off&amp;display=block">
<link rel="stylesheet" href="/static/css/theme.css">
<style>
  /* Intent: a customer at a counter, one thumb, in a hurry. Focal: the upload pill, then the verdict. */
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: 12px var(--gutter);
         max-width: 480px; width: 100%; margin: 0 auto; }
  main { flex: 1; width: 100%; max-width: 480px; margin: 0 auto; padding: var(--s-2) var(--gutter) var(--s-8);
         display: flex; flex-direction: column; gap: var(--s-4); }
  .paying { padding: var(--s-6); display: grid; gap: 4px; }
  .paying .k { font-weight: 600; font-size: var(--t-sm); }
  .paying h1 { font-size: var(--t-2xl); letter-spacing: -0.01em; }
  .paying p { font-size: var(--t-sm); opacity: .8; }
  .langs { display: flex; gap: var(--s-2); }
  .langs button { min-height: 40px; }
  input[type=file] { display: none; }
  .big { width: 100%; min-height: 64px; font-size: var(--t-lg); border-radius: var(--r-pill); }
  .tip { text-align: center; color: var(--ink-2); font-size: var(--t-sm); }
  .spinner { width: 44px; height: 44px; margin: var(--s-2) auto; border-radius: 50%; border: 4px solid var(--sage-3);
             border-top-color: var(--ink); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .sent { display: flex; align-items: center; justify-content: center; gap: var(--s-2); font-weight: 700; font-size: var(--t-lg); }
  .sent .ms { color: var(--ok); }
  /* status card: the script sets "status <STATUS>" + text + <small> reason; the icon comes from CSS */
  .status { display: grid; grid-template-columns: auto 1fr; column-gap: var(--s-3); align-items: center; padding: var(--s-5);
            border-radius: var(--r-card); font-weight: 800; font-size: var(--t-xl); background: var(--paper); box-shadow: var(--shadow-card);
            border: 2px solid transparent; }
  .status::before { grid-row: span 2; font-family: "Material Symbols Outlined"; font-size: 40px; font-weight: 400;
                    font-variation-settings: "FILL" 1; content: "hourglass_top"; }
  .status small { grid-column: 2; display: block; margin-top: 2px; font-weight: 500; font-size: var(--t-sm); }
  .status.WAITING { background: var(--wait-tint); color: var(--on-wait-tint); border-color: var(--wait); }
  .status.WAITING::before { color: var(--wait); content: "hourglass_top"; }
  .status.VERIFIED { background: var(--ok-tint); color: var(--on-ok-tint); border-color: var(--ok); }
  .status.VERIFIED::before { color: var(--ok); content: "check_circle"; }
  .status.NOT_VERIFIED { background: var(--no-tint); color: var(--on-no-tint); border-color: var(--no); }
  .status.NOT_VERIFIED::before { color: var(--no); content: "cancel"; }
  .error { display: flex; gap: var(--s-2); align-items: flex-start; background: var(--no-tint); color: var(--on-no-tint);
           border-radius: var(--r-tile); padding: 12px 14px; font-weight: 600; }
  .error::before { font-family: "Material Symbols Outlined"; font-size: 22px; content: "error"; font-weight: 400; }
  .again { align-self: center; }
  .privacy { display: flex; gap: var(--s-2); align-items: flex-start; justify-content: center; color: var(--ink-3); font-size: var(--t-xs);
             text-align: center; padding: var(--s-4) var(--gutter) var(--s-6); max-width: 480px; margin: 0 auto; }
</style>
</head>
<body>
  <header class="bar">
    <span class="site-brand"><span class="site-mark"><span class="ms" aria-hidden="true">verified</span></span>SatyaSceau</span>
    <div class="langs seg" role="group" aria-label="Voice language">
      <button type="button" data-lang="hi" aria-pressed="true"><span class="ms" aria-hidden="true">volume_up</span>हिंदी</button>
      <button type="button" data-lang="en" aria-pressed="false"><span class="ms" aria-hidden="true">volume_up</span>English</button>
    </div>
  </header>

  <main>
    <section class="slip paying">
      <span class="k">Paying</span>
      <h1 id="shopName">this shop</h1>
      <p>Show your payment: upload the original screenshot from your UPI app.</p>
    </section>

    <!-- No `capture` attribute: the phone offers both camera and gallery. -->
    <input id="file" type="file" accept="image/*">
    <button id="pick" class="btn btn-ink big" type="button"><span class="ms" aria-hidden="true">upload_file</span>Upload payment screenshot</button>
    <p class="tip">The success screen that shows the 12-digit UPI reference (UTR).</p>

    <div id="spinner" class="spinner hidden" role="status" aria-label="Checking"></div>
    <div id="sent" class="sent hidden"><span class="ms fill" aria-hidden="true">task_alt</span>Sent. Show this to the shopkeeper.</div>
    <div id="status" class="status hidden" aria-live="polite"></div>
    <div id="error" class="error hidden" role="alert"></div>
    <button id="again" class="link-btn again hidden" type="button">Upload a different screenshot</button>
  </main>

  <footer class="privacy"><span class="ms" aria-hidden="true">lock</span><span>Your screenshot is checked and immediately discarded. It is never stored.</span></footer>

<script>
(function () {
  var merchantId = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  var $ = function (id) { return document.getElementById(id); };
  var pick = $("pick"), file = $("file"), spinner = $("spinner"), sent = $("sent"),
      statusEl = $("status"), errorEl = $("error"), again = $("again");
  var pollTimer = null;

  // "Paying <shop>": the shop's public name (also printed on its QR poster).
  fetch("/api/merchants/" + encodeURIComponent(merchantId) + "/public")
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.name) $("shopName").textContent = d.name; })
    .catch(function () { /* offline: keep "this shop" */ });

  var LABELS = {
    en: { WAITING: "Checking with the bank…", VERIFIED: "Payment verified", NOT_VERIFIED: "Payment not verified" },
    hi: { WAITING: "बैंक से पुष्टि हो रही है…", VERIFIED: "भुगतान सत्यापित", NOT_VERIFIED: "भुगतान सत्यापित नहीं" }
  };
  // Spoken verdicts, so the customer hears the result too (same idea as the merchant screen).
  var SAY = {
    en: { WAITING: "Waiting for the bank. Please wait a moment.", VERIFIED: "Payment verified.",
          NOT_VERIFIED: "Payment not verified." },
    hi: { WAITING: "बैंक से पुष्टि का इंतज़ार है, कृपया रुकें", VERIFIED: "भुगतान सत्यापित हो गया",
          NOT_VERIFIED: "भुगतान सत्यापित नहीं हुआ" }
  };
  var lang = "hi";
  try { if (localStorage.getItem("satyasceau.lang") === "en") lang = "en"; } catch (e) { /* private mode */ }
  var lastSpoken = "";
  var canSpeak = "speechSynthesis" in window;

  function voiceFor(code) {
    if (!canSpeak) return null;
    var voices = speechSynthesis.getVoices();
    for (var i = 0; i < voices.length; i++) if (voices[i].lang === code) return voices[i];
    for (var j = 0; j < voices.length; j++) if (voices[j].lang.toLowerCase().indexOf(code.slice(0, 2)) === 0) return voices[j];
    return null;
  }

  function unlockAudio() {           // must run inside a tap: phones block speech until the user interacts
    if (!canSpeak) return;
    try { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
  }

  function speak(status, caseId) {
    var key = caseId + ":" + status;
    if (!canSpeak || !SAY.en[status] || key === lastSpoken) return;   // each verdict once
    lastSpoken = key;
    var useHindi = lang === "hi" && voiceFor("hi-IN");               // no Hindi voice -> English
    var code = useHindi ? "hi-IN" : "en-IN";
    var u = new SpeechSynthesisUtterance(SAY[useHindi ? "hi" : "en"][status]);
    u.lang = code;
    var v = voiceFor(code);
    if (v) u.voice = v;
    u.rate = 0.95;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    if (status === "NOT_VERIFIED" && navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  var langButtons = document.querySelectorAll("[data-lang]");
  function setLang(next) {
    lang = next;
    try { localStorage.setItem("satyasceau.lang", next); } catch (e) { /* private mode */ }
    for (var i = 0; i < langButtons.length; i++) langButtons[i].setAttribute("aria-pressed", String(langButtons[i].dataset.lang === next));
  }
  for (var b = 0; b < langButtons.length; b++) {
    langButtons[b].addEventListener("click", function () { unlockAudio(); setLang(this.dataset.lang); });
  }
  setLang(lang);

  function show(el, on) { el.classList.toggle("hidden", !on); }

  function showStatus(data) {
    statusEl.className = "status " + data.status;
    statusEl.textContent = LABELS[lang][data.status] || data.status;
    speak(data.status, data.case_id);
    var small = document.createElement("small");
    small.textContent = data.reason || "";   // textContent: never inject server text as HTML
    statusEl.appendChild(small);
    show(statusEl, true);
  }

  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  function poll(caseId) {
    stopPolling();
    pollTimer = setInterval(function () {
      fetch("/api/cases/" + encodeURIComponent(caseId))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (!data) return;
          showStatus(data);
          if (data.status !== "WAITING") stopPolling();
        })
        .catch(function () { /* offline blip: try again on the next tick */ });
    }, 3000);
  }

  function fail(message) {
    show(spinner, false);
    errorEl.textContent = message;
    show(errorEl, true);
    pick.disabled = false;
    show(pick, true);
  }

  function reset() {
    stopPolling();
    [sent, statusEl, errorEl, again, spinner].forEach(function (el) { show(el, false); });
    file.value = "";
    pick.disabled = false;
    show(pick, true);
  }

  pick.addEventListener("click", function () { unlockAudio(); file.click(); });
  again.addEventListener("click", reset);

  file.addEventListener("change", function () {
    var img = file.files && file.files[0];
    if (!img) return;
    stopPolling();
    [sent, statusEl, errorEl, again].forEach(function (el) { show(el, false); });
    pick.disabled = true;
    show(pick, false);
    show(spinner, true);

    var form = new FormData();
    form.append("merchant_id", merchantId);
    form.append("image", img);
    fetch("/api/proof", { method: "POST", body: form })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) { return { ok: r.ok, code: r.status, body: body }; });
      })
      .then(function (res) {
        if (!res.ok) {
          var msg = { 404: "This QR code is not valid. Ask the shopkeeper for a new one.",
                      413: "That photo is too big. Use a screenshot instead.",
                      415: "Please choose a photo or screenshot (JPEG, PNG or WebP).",
                      400: "We could not read that image. Try another screenshot." }[res.code];
          return fail(msg || "Something went wrong. Please try again.");
        }
        show(spinner, false);
        show(sent, true);
        showStatus(res.body);
        show(again, true);
        if (res.body.status === "WAITING") poll(res.body.case_id);
      })
      .catch(function () { fail("No connection. Check your internet and try again."); });
  });
})();
</script>
</body>
</html>
